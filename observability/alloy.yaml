# Agent Grafana Alloy : scrape /metrics de l'API + métriques des pods (kubelet/cAdvisor),
# puis envoi vers Grafana Cloud (Prometheus remote write).
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: sentiment
data:
  config.alloy: |
    // --- 1. Découverte des pods de l'API dans le namespace sentiment ---
    discovery.kubernetes "pods" {
      role = "pod"
      namespaces {
        names = ["sentiment"]
      }
    }

    discovery.relabel "api" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        regex         = "api"
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_phase"]
        regex         = "Running"
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_ip"]
        target_label  = "__address__"
        replacement   = "${1}:8000"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
    }

    prometheus.scrape "api" {
      targets         = discovery.relabel.api.output
      job_name        = "sentiment-api"
      scrape_interval = "15s"
      forward_to      = [prometheus.remote_write.grafana.receiver]
    }

    // --- 2. Métriques des conteneurs via le kubelet (cAdvisor) ---
    discovery.kubernetes "nodes" {
      role = "node"
    }

    discovery.relabel "kubelet" {
      targets = discovery.kubernetes.nodes.targets

      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "__address__"
        replacement   = "${1}:10250"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node"
      }
    }

    prometheus.scrape "kubelet" {
      targets           = discovery.relabel.kubelet.output
      scheme            = "https"
      metrics_path      = "/metrics/cadvisor"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      tls_config {
        insecure_skip_verify = true
      }
      scrape_interval = "30s"
      forward_to      = [prometheus.remote_write.grafana.receiver]

      // On ne garde que le strict nécessaire : CPU et mémoire par conteneur.
      metric_relabel_configs {
        source_labels = ["__name__"]
        regex         = "container_cpu_usage_seconds_total|container_memory_working_set_bytes"
        action        = "keep"
      }
    }

    // --- 3. Envoi vers Grafana Cloud ---
    prometheus.remote_write "grafana" {
      external_labels = {
        cluster = "docker-desktop",
      }
      endpoint {
        url = sys.env("GRAFANA_REMOTE_WRITE_URL")
        basic_auth {
          username = sys.env("GRAFANA_USERNAME")
          password = sys.env("GRAFANA_TOKEN")
        }
      }
    }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: sentiment
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-sentiment
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "nodes/metrics", "pods", "namespaces", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-sentiment
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy-sentiment
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: sentiment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: sentiment
  labels:
    app.kubernetes.io/name: alloy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
    spec:
      serviceAccountName: alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.22.0
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy/data
            - --server.http.listen-addr=0.0.0.0:12345
          envFrom:
            - secretRef:
                name: grafana-cloud
          ports:
            - name: http
              containerPort: 12345
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
            - name: data
              mountPath: /var/lib/alloy/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: data
          emptyDir: {}
