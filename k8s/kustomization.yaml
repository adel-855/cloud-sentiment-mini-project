apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sentiment
resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - api.yaml
  - hpa.yaml
# Le Secret est généré depuis k8s/.env (non versionné) : aucun identifiant dans Git.
secretGenerator:
  - name: postgres-credentials
    envs:
      - .env
    options:
      disableNameSuffixHash: true
